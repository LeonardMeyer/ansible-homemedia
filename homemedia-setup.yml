---
- name: Setup homemedia server
  hosts: all
  remote_user: "{{ owner }}"
  roles:
    - { role: docker, tags: docker }
    - { role: filesystem, tags: filesystem }
    - { role: firewall, tags: firewall }
    # - { role: geoblocking, tags: geoblocking }
    - { role: crowdsec, tags: crowdsec }
    - { role: rustic, tags: rustic }
    - { role: compose, tags: compose }
  tasks:
    - name: Enable rustic backup schedule
      ansible.builtin.include_role:
        name: rustic
        tasks_from: schedule
      tags: rustic
