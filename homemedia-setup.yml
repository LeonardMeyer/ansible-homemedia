---
- name: Setup homemedia server
  hosts: all
  remote_user: "{{ owner }}"
  roles:
    - docker
    - filesystem
    - firewall
    # - geoblocking
    - crowdsec
    - rustic
    - compose
  tasks:
    - name: Enable rustic backup schedule
      ansible.builtin.include_role:
        name: rustic
        tasks_from: schedule
