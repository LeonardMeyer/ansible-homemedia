---

- name: Ensure user exists - {{ owner }}
  ansible.builtin.user:
    name: "{{ owner }}"
    createhome: true

- name: Copy secure SSH config
  ansible.builtin.template:
    src: templates/sshd_config.j2
    dest: /etc/ssh/sshd_config
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH daemon

- name: Ensure media and torrent folders exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ owner }}"
    mode: "0755"
  loop:
    - "{{ media_dir }}/movies"
    - "{{ media_dir }}/tv"
    - "{{ media_dir }}/anime"
    - "{{ torrents_dir }}/movies"
    - "{{ torrents_dir }}/tv"
    - "{{ torrents_dir }}/anime"
    - "{{ torrents_dir }}/blackhole"

- name: Ensure app folders exist
  ansible.builtin.file:
    path: "{{ app_dir }}/{{ item.app }}/{{ item.dir }}"
    state: directory
    owner: "{{ owner }}"
    mode: "0755"
  loop:
    - { app: 'bazarr', dir: 'config' }
    - { app: 'sonarr', dir: 'config' }
    - { app: 'radarr', dir: 'config' }
    - { app: 'prowlarr', dir: 'config' }
    - { app: 'deluge', dir: 'config' }
    - { app: 'portainer', dir: 'config' }
    - { app: 'caddy', dir: 'config' }
    - { app: 'caddy', dir: 'data' }
    - { app: 'caddy', dir: 'auth' }
    - { app: 'wud', dir: 'store' }
    - { app: 'jellyfin', dir: 'config' }
    - { app: 'jellyfin', dir: 'cache' }
    - { app: 'profilarr', dir: 'config' }

- name: Ensure Caddy access log folder exists
  ansible.builtin.file:
    path: "{{ caddy_access_log_path }}"
    state: directory
    owner: "{{ owner }}"
    mode: "0755"

- name: Set up permissions
  ansible.builtin.file:
    path: "{{ root_dir }}"
    recurse: true
    state: directory
    owner: "{{ owner }}"
    group: "{{ owner }}"
    mode: '0774'
