---


- name: Remove any pre-existing Docker APT source files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /etc/apt/sources.list.d/docker.sources
    - /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.list
    - /etc/apt/sources.list.d/download_docker_com_linux_ubuntu.sources

- name: Install Docker dependencies
  ansible.builtin.apt:
    update_cache: true
    pkg:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - software-properties-common
      - apt-transport-https

- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
        | gpg --dearmor -o /etc/apt/keyrings/docker-archive-keyring.gpg
    executable: /bin/bash
    creates: /etc/apt/keyrings/docker-archive-keyring.gpg
  changed_when: false

- name: Add Docker APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/docker-archive-keyring.gpg]
      https://download.docker.com/linux/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker

- name: Install Docker
  ansible.builtin.apt:
    update_cache: true
    pkg:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin

- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker

- name: Ensure user belongs to docker group - {{ owner }}
  ansible.builtin.user:
    name: "{{ owner }}"
    groups: docker
    append: true
