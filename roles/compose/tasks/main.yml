---

- name: Get owner uid and gid
  ansible.builtin.getent:
    database: passwd
    key: "{{ owner }}"

- name: Setting uid and gid as facts
  ansible.builtin.set_fact:
    compose_uid: "{{ ansible_facts.getent_passwd[owner][1] }}"
    compose_gid: "{{ ansible_facts.getent_passwd[owner][2] }}"

- name: Copy docker-compose file
  ansible.builtin.template:
    owner: "{{ owner }}"
    group: "{{ owner }}"
    mode: '0770'
    src: templates/docker-compose.yml.j2
    dest: /etc/docker/docker-compose.yml

- name: Copy Caddyfile
  ansible.builtin.template:
    owner: "{{ owner }}"
    group: "{{ owner }}"
    mode: '0770'
    src: templates/Caddyfile.j2
    dest: "{{ app_dir }}/caddy/Caddyfile"
  register: caddy_caddyfile

- name: Copy Caddy Dockerfile
  ansible.builtin.template:
    owner: "{{ owner }}"
    group: "{{ owner }}"
    mode: '0770'
    src: templates/Dockerfile
    dest: "{{ app_dir }}/caddy/Dockerfile"
  register: caddy_dockerfile

- name: Rebuild Caddy image
  community.docker.docker_compose_v2:
    project_src: /etc/docker/
    build: always
    services:
      - caddy
    state: present
  when: caddy_dockerfile.changed

- name: Restart Caddy
  community.docker.docker_compose_v2:
    project_src: /etc/docker/
    services:
      - caddy
    state: restarted
  when: caddy_caddyfile.changed and not caddy_dockerfile.changed

- name: Pull and start docker containers
  community.docker.docker_compose_v2:
    project_src: /etc/docker/
    pull: missing
    build: policy
    state: present
  register: compose_result

- name: Show compose actions
  ansible.builtin.debug:
    var: compose_result.actions
  when: compose_result.actions | length > 0 # noqa: no-handler

- name: Configure Jellyfin startup wizard
  ansible.builtin.import_tasks: jellyfin.yml
