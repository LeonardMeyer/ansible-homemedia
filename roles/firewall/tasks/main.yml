---
- name: Install ufw
  ansible.builtin.apt:
    package: ufw
    state: present

- name: Disable ufw
  community.general.ufw:
    state: disabled

- name: Deny all incoming traffic
  community.general.ufw:
    policy: deny
    direction: incoming
  notify: Restart ufw

- name: Allow all outgoing traffic
  community.general.ufw:
    policy: allow
    direction: outgoing
  notify: Restart ufw

- name: Allow SSH traffic
  community.general.ufw:
    rule: limit
    port: '22'
    proto: tcp
  notify: Restart ufw

- name: Allow BitTorrent incoming traffic
  community.general.ufw:
    rule: allow
    port: '51413'
    proto: tcp
  notify: Restart ufw

- name: Allow BitTorrent incoming traffic (UDP)
  community.general.ufw:
    rule: allow
    port: '51413'
    proto: udp
  notify: Restart ufw

- name: Allow HTTP traffic
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp
  notify: Restart ufw

- name: Allow SSL/TLS traffic
  community.general.ufw:
    rule: allow
    port: '443'
    proto: tcp
  notify: Restart ufw

- name: Allow SSL/TLS traffic (UDP)
  community.general.ufw:
    rule: allow
    port: '443'
    proto: udp
  notify: Restart ufw

- name: Enable ufw
  community.general.ufw:
    state: enabled
