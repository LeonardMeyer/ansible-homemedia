<svg width="680" viewBox="0 0 680 980" xmlns="http://www.w3.org/2000/svg">
<style>
  :root {
    --bg:          #ffffff;
    --bg-card:     #F1EFE8;
    --text-pri:    #2C2C2A;
    --text-sec:    #5F5E5A;
    --text-muted:  #888780;
    --border-mute: #B4B2A9;

    --amber-fill:  #FAEEDA;
    --amber-str:   #BA7517;
    --amber-title: #633806;
    --amber-sub:   #854F0B;
    --amber-label: #BA7517;

    --blue-fill:   #E6F1FB;
    --blue-str:    #185FA5;
    --blue-title:  #0C447C;
    --blue-sub:    #185FA5;

    --teal-fill:   #E1F5EE;
    --teal-str:    #0F6E56;
    --teal-title:  #085041;
    --teal-accept: #1D9E75;

    --red-fill:    #FCEBEB;
    --red-str:     #A32D2D;
    --red-title:   #791F1F;
    --red-sub:     #A32D2D;

    --gray-str:    #5F5E5A;
    --arrow:       #888888;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:          #1a1a18;
      --bg-card:     #2C2C2A;
      --text-pri:    #E8E6DE;
      --text-sec:    #B4B2A9;
      --text-muted:  #888780;
      --border-mute: #444441;

      --amber-fill:  #412402;
      --amber-str:   #EF9F27;
      --amber-title: #FAC775;
      --amber-sub:   #EF9F27;
      --amber-label: #EF9F27;

      --blue-fill:   #042C53;
      --blue-str:    #378ADD;
      --blue-title:  #B5D4F4;
      --blue-sub:    #378ADD;

      --teal-fill:   #04342C;
      --teal-str:    #1D9E75;
      --teal-title:  #9FE1CB;
      --teal-accept: #5DCAA5;

      --red-fill:    #501313;
      --red-str:     #E24B4A;
      --red-title:   #F7C1C1;
      --red-sub:     #E24B4A;

      --gray-str:    #B4B2A9;
      --arrow:       #888780;
    }
  }

  svg { background: var(--bg); }
  text { font-family: sans-serif; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Incoming packet -->
<rect x="230" y="20" width="220" height="44" rx="8" fill="var(--bg-card)" stroke="var(--gray-str)" stroke-width="0.5"/>
<text font-size="13" font-weight="500" x="340" y="42" text-anchor="middle" dominant-baseline="central" fill="var(--text-pri)">Incoming packet (internet)</text>
<line x1="340" y1="64" x2="340" y2="90" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- TABLE MANGLE -->
<rect x="40" y="94" width="600" height="260" rx="14" fill="none" stroke="var(--amber-str)" stroke-width="1.5" stroke-dasharray="6,3"/>
<text font-size="12" font-weight="500" x="56" y="114" fill="var(--amber-label)">table mangle</text>

<!-- PREROUTING builtin -->
<rect x="60" y="122" width="560" height="40" rx="8" fill="none" stroke="var(--amber-str)" stroke-width="0.5" stroke-dasharray="3,2"/>
<text font-size="12" x="340" y="142" text-anchor="middle" dominant-baseline="central" fill="var(--amber-label)">built-in chain PREROUTING  →  redirects to GEOIP-SHELL_IN</text>
<line x1="340" y1="162" x2="340" y2="182" stroke="var(--amber-str)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- GEOIP-SHELL_IN custom chain -->
<rect x="60" y="186" width="560" height="148" rx="10" fill="none" stroke="var(--amber-sub)" stroke-width="1" stroke-dasharray="4,2"/>
<text font-size="12" font-weight="500" x="76" y="204" fill="var(--amber-sub)">custom chain GEOIP-SHELL_IN  —  all geo filtering happens here</text>

<!-- Allow related/established -->
<rect x="80" y="212" width="260" height="40" rx="6" fill="var(--bg-card)" stroke="var(--gray-str)" stroke-width="0.5"/>
<text font-size="13" font-weight="500" x="210" y="228" text-anchor="middle" dominant-baseline="central" fill="var(--text-pri)">ACCEPT — related/established</text>
<text font-size="12" x="210" y="244" text-anchor="middle" dominant-baseline="central" fill="var(--text-sec)">Already established connections</text>

<!-- Whitelist/blacklist ipset -->
<rect x="360" y="212" width="240" height="40" rx="6" fill="var(--amber-fill)" stroke="var(--amber-str)" stroke-width="0.5"/>
<text font-size="13" font-weight="500" x="480" y="228" text-anchor="middle" dominant-baseline="central" fill="var(--amber-title)">ACCEPT / DROP via ipset</text>
<text font-size="12" x="480" y="244" text-anchor="middle" dominant-baseline="central" fill="var(--amber-sub)">Country whitelist or blacklist</text>

<!-- Final DROP -->
<rect x="200" y="268" width="280" height="40" rx="6" fill="var(--red-fill)" stroke="var(--red-str)" stroke-width="0.5"/>
<text font-size="13" font-weight="500" x="340" y="284" text-anchor="middle" dominant-baseline="central" fill="var(--red-title)">DROP ✕  (final — packet discarded)</text>
<text font-size="12" x="340" y="300" text-anchor="middle" dominant-baseline="central" fill="var(--red-sub)">Never reaches filter, CrowdSec, SSH…</text>

<!-- Arrow out of mangle -->
<line x1="340" y1="354" x2="340" y2="384" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-size="12" x="362" y="372" fill="var(--text-sec)">IP allowed by geoip-shell</text>

<!-- NAT PREROUTING -->
<rect x="40" y="388" width="600" height="50" rx="10" fill="none" stroke="var(--border-mute)" stroke-width="0.5" stroke-dasharray="4,3"/>
<text font-size="12" font-weight="500" x="56" y="406" fill="var(--text-sec)">table nat — PREROUTING</text>
<text font-size="12" x="340" y="422" text-anchor="middle" fill="var(--text-muted)">DNAT, port redirections</text>
<line x1="340" y1="438" x2="340" y2="462" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- ROUTING DECISION -->
<rect x="210" y="466" width="260" height="44" rx="8" fill="var(--bg-card)" stroke="var(--gray-str)" stroke-width="0.5"/>
<text font-size="13" font-weight="500" x="340" y="488" text-anchor="middle" dominant-baseline="central" fill="var(--text-pri)">Routing decision</text>

<!-- Left arrow INPUT -->
<line x1="280" y1="510" x2="170" y2="554" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-size="12" x="195" y="540" text-anchor="middle" fill="var(--text-sec)">local machine</text>
<!-- Right arrow FORWARD -->
<line x1="400" y1="510" x2="510" y2="554" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-size="12" x="510" y="540" text-anchor="middle" fill="var(--text-sec)">Docker / forward</text>

<!-- LEFT BRANCH filter INPUT -->
<rect x="30" y="558" width="290" height="210" rx="12" fill="none" stroke="var(--blue-str)" stroke-width="1.5" stroke-dasharray="5,3"/>
<text font-size="12" font-weight="500" x="46" y="576" fill="var(--blue-str)">table filter — INPUT</text>

<rect x="50" y="584" width="250" height="54" rx="8" fill="var(--blue-fill)" stroke="var(--blue-str)" stroke-width="0.5"/>
<text font-size="13" font-weight="500" x="175" y="606" text-anchor="middle" dominant-baseline="central" fill="var(--blue-title)">CrowdSec bouncer</text>
<text font-size="12" x="175" y="624" text-anchor="middle" dominant-baseline="central" fill="var(--blue-sub)">DROP if in crowdsec-blacklists</text>

<line x1="175" y1="638" x2="175" y2="658" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="50" y="662" width="250" height="44" rx="8" fill="var(--teal-fill)" stroke="var(--teal-str)" stroke-width="0.5"/>
<text font-size="13" font-weight="500" x="175" y="684" text-anchor="middle" dominant-baseline="central" fill="var(--teal-title)">SSH rules, local services…</text>

<line x1="175" y1="706" x2="175" y2="726" stroke="var(--teal-accept)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-size="12" x="175" y="740" text-anchor="middle" fill="var(--teal-accept)">ACCEPT ✓</text>

<!-- RIGHT BRANCH filter FORWARD + DOCKER-USER -->
<rect x="360" y="558" width="290" height="210" rx="12" fill="none" stroke="var(--blue-str)" stroke-width="1.5" stroke-dasharray="5,3"/>
<text font-size="12" font-weight="500" x="376" y="576" fill="var(--blue-str)">table filter — FORWARD → DOCKER-USER</text>

<rect x="380" y="584" width="250" height="54" rx="8" fill="var(--blue-fill)" stroke="var(--blue-str)" stroke-width="0.5"/>
<text font-size="13" font-weight="500" x="505" y="606" text-anchor="middle" dominant-baseline="central" fill="var(--blue-title)">CrowdSec bouncer</text>
<text font-size="12" x="505" y="624" text-anchor="middle" dominant-baseline="central" fill="var(--blue-sub)">DROP if in crowdsec-blacklists</text>

<line x1="505" y1="638" x2="505" y2="658" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="380" y="662" width="250" height="44" rx="8" fill="var(--teal-fill)" stroke="var(--teal-str)" stroke-width="0.5"/>
<text font-size="13" font-weight="500" x="505" y="684" text-anchor="middle" dominant-baseline="central" fill="var(--teal-title)">Docker rules (RETURN)</text>

<line x1="505" y1="706" x2="505" y2="726" stroke="var(--teal-accept)" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-size="12" x="505" y="740" text-anchor="middle" fill="var(--teal-accept)">ACCEPT ✓</text>

<!-- LEGEND -->
<rect x="40" y="790" width="600" height="175" rx="12" fill="none" stroke="var(--border-mute)" stroke-width="0.5"/>
<text font-size="13" font-weight="500" x="340" y="816" text-anchor="middle" dominant-baseline="central" fill="var(--text-pri)">Execution order</text>

<rect x="60" y="832" width="14" height="14" rx="3" fill="var(--amber-fill)" stroke="var(--amber-str)" stroke-width="0.5"/>
<text font-size="12" x="82" y="843" fill="var(--text-pri)">① geoip-shell — table mangle, chain GEOIP-SHELL_IN (via PREROUTING)</text>
<text font-size="12" x="82" y="860" fill="var(--text-sec)">    Final DROP before routing — covers both INPUT and FORWARD in one place</text>

<rect x="60" y="874" width="14" height="14" rx="3" fill="var(--blue-fill)" stroke="var(--blue-str)" stroke-width="0.5"/>
<text font-size="12" x="82" y="885" fill="var(--text-pri)">② CrowdSec — table filter, INPUT and DOCKER-USER</text>
<text font-size="12" x="82" y="902" fill="var(--text-sec)">    Only sees packets already allowed by geoip-shell</text>

<rect x="60" y="916" width="14" height="14" rx="3" fill="var(--teal-fill)" stroke="var(--teal-str)" stroke-width="0.5"/>
<text font-size="12" x="82" y="927" fill="var(--text-pri)">③ Application rules — SSH, Docker…</text>

<rect x="60" y="940" width="14" height="14" rx="3" fill="var(--red-fill)" stroke="var(--red-str)" stroke-width="0.5"/>
<text font-size="12" x="82" y="951" fill="var(--text-pri)">DROP in mangle is final — packet never reaches filter table</text>

</svg>
